<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Translator</title>
  <link rel="stylesheet" href="styles.css">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=swap_horiz" />
</head>
<body>
  <div class="comntainer">

    <header class="header">
      <div class="header-content">
        <div class="logo">
          <span class="google-blue">G</span>
          <span class="google-red">o</span>
          <span class="google-yellow">o</span>
          <span class="google-blue">g</span>
          <span class="google-green">l</span>
          <span class="google-red">e</span>
          <span class="translate">Translator</span>
        </div>
      </div>
    </header>

    <section class="language-selection">
      <div class="source-language">
        <select id="sourceLanguage">
          <option value="auto">Detect Language</option>
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="ru">Russian</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
        </select>
      </div>

      <button class="swap-languages icon-button" id="swapLanguages">
        <span class="material-symbols-outlined">
          swap_horiz
        </span>
      </button>

      <div class="target-language">
        <select id="targetLanguage">
          <option value="auto">Detect Language</option>
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="ru">Russian</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
        </select>
      </div>
    </section>

  </div>
</body>
</html>
