<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Translate</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="icon" href="icon.svg" sizes="64x64">
  <link rel="stylesheet" href="styles.css">

  <script type="module" src="scripts.js"></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <span class="translate-brand">VeloWords</span>
          <span class="translate">Translate</span>
        </div>
      </div>
    </header>

    <!-- Language Selection -->
    <section class="language-selection">
      <div class="source-language">
        <select id="sourceLanguage">
          <option value="auto">Detect Language</option>
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="ru">Russian</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
        </select>
      </div>

      <button class="swap-languages icon-button" id="swapLanguages">
        <span class="material-symbols-outlined">
          swap_horiz
        </span>
      </button>

      <div class="target-language">
        <select id="targetLanguage">
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="ru">Russian</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
        </select>
      </div>
    </section>

    <!-- Translation Area -->
    <main class="translation-area">
      <section class="input-section">
        <div class="textarea-container">
          <textarea 
            id="inputText"
            placeholder="Enter text to translate..."
            maxlength="5000"
          ></textarea>

          <button type="button" class="icon-button clear-button" id="clearButton">
            <span class="material-symbols-outlined">
              clear
            </span>
          </button>
        </div>
        <footer class="input-controls">
          <button class="icon-button mic-button" id="micButton">
            <span class="material-symbols-outlined">
              mic
            </span>
          </button>
        </footer>
      </section>

      <section class="output-section">
        <div class="textarea-container">
          <output id="outputText"></output>

          <footer class="output-controls">
            <button class="icon-button copy-button" id="copyButton">
              <span class="material-symbols-outlined">
                content_copy
              </span>
            </button>
            <button class="icon-button volume-button" id="volumeButton">
              <span class="material-symbols-outlined">
                volume_up
              </span>
            </button>
          </footer>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
